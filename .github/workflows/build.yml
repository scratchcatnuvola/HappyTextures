name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fix include paths for local dependencies
        run: |
          find src -type f \( -name "*.hpp" -o -name "*.cpp" \) -exec sed -i 's|#include <alphalaneous.alphas_geode_utils/include/|#include <|g' {} +
          find src -type f \( -name "*.hpp" -o -name "*.cpp" \) -exec sed -i 's|#include <geode.texture-loader/include/|#include <|g' {} +
          find src -type f \( -name "*.hpp" -o -name "*.cpp" \) -exec sed -i '/raydeeux.pages_api/d' {} +
        shell: bash

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          cli: 'nightly'
          sdk: 'nightly'
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
